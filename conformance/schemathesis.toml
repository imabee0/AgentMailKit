# Path parameters for the P1 gate's schemathesis run.
#
# WHY THIS EXISTS. Mounting the message and thread get-by-id operations made the gate WORSE before
# it made it better: schemathesis generates random UUIDs and Message-IDs for `{thread_id}` and
# `{message_id}`, every one of them 404s, and hypothesis then aborts those operations with
# `filter_too_much` — "Too many generated examples are filtered out". The 41-operation run reported
# 8 failed health checks and warned that **13 operations repeatedly returned 404, preventing tests
# from reaching your API's core logic**. The exit code went red while the coverage silently fell.
#
# So the gate seeds one real inbox, pod, thread, message and api-key, exports their ids, and binds
# them here. `scripts/p1-gate.sh` is what sets these variables; a missing one is a hard ConfigError
# from schemathesis rather than a silent fallback to random generation, which is the behaviour we
# want — a gate that quietly stopped reaching its endpoints is exactly what this file is fixing.
#
# These are SEEDS, not a whitelist: schemathesis still fuzzes every other parameter, body and
# header on those operations. Pinning the id is what lets it get past the lookup to the logic.
[parameters]
"path.inbox_id" = "${AMK_ST_INBOX_ID}"
"path.pod_id" = "${AMK_ST_POD_ID}"
"path.thread_id" = "${AMK_ST_THREAD_ID}"
"path.message_id" = "${AMK_ST_MESSAGE_ID}"
"path.api_key_id" = "${AMK_ST_API_KEY_ID}"

# ---- DELETE gets throwaway ids, because seeding alone is not enough ----------------------------
#
# The first version of this file pinned the ids above for EVERY operation, and the 404 warning got
# WORSE, not better — from 13 operations to 25. The mechanism, once the DELETE list is read beside
# the pin list, is obvious: ten DELETE operations are mounted, so a fuzzer handed a real
# `{thread_id}` reliably deletes the seeded thread, and every by-id operation after that 404s.
# Seeding plus a mounted DELETE on the same pinned id is a self-destroying fixture.
#
# So DELETE gets ids that are syntactically valid and deliberately absent. It still exercises the
# real code path — decode the segment, resolve the mount, check the scope, miss — and it no longer
# takes the other 30 operations down with it. Verifying a DELETE's success path is an integration
# test's job (`crates/amk-http/tests/mail_reads.rs` does exactly that, against rows it seeds and
# owns); the fuzzer's job here is the shapes around it.
[[operations]]
include-method = "DELETE"

[operations.parameters]
"path.thread_id" = "00000000-0000-4000-8000-0000000000de"
"path.message_id" = "<absent-by-design@appsynergy.io>"
"path.api_key_id" = "00000000-0000-4000-8000-0000000000ad"
