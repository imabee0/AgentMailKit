name: CI

# WHAT RUNS WHEN, in one place, because the answer used to live in six documents.
#
#   pull_request   the fast lane — everything a reviewer needs before merging, nothing that needs
#                  a credential or hardware. Expensive jobs run only if their inputs changed.
#   push to main   the same, plus the full gate unconditionally, plus a container image built once
#                  and promoted by digest through staging and production.
#   schedule       the supply-chain audit alone. Advisories land without this repository changing,
#                  so a gate that only runs on push cannot see them.
#   workflow_dispatch  a manual full run, including jobs change-detection would otherwise skip.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Daily, 06:14 UTC. Off the hour deliberately — GitHub queues scheduled runs hardest at :00.
    - cron: "14 6 * * *"
  workflow_dispatch:

# Least privilege at the top; jobs that need more say so themselves. Without this line the
# workflow inherits the repository default, which on older repositories is write-all.
permissions:
  contents: read

# One in-flight run per ref. A new push to a PR makes the previous run's answer irrelevant, so
# cancel it and stop paying for it. NEVER cancel on main: those runs publish artifacts and deploy,
# and a half-finished promotion is worse than a slow one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # A CI machine gains nothing from incremental compilation — every job starts from a restored
  # cache and never recompiles the same crate twice — and it costs cache size and IO.
  CARGO_INCREMENTAL: "0"
  # Fail fast on a network hiccup instead of hanging a job for its full timeout.
  CARGO_NET_RETRY: "3"
  RUSTUP_MAX_RETRIES: "10"

jobs:
  # ---------------------------------------------------------------- what changed
  # Everything downstream keys off this. The filters name INPUTS, not directories for their own
  # sake: `rust` includes Cargo.lock and rust-toolchain.toml because both change what a compile
  # produces, and deny.toml because it changes what the audit accepts.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # dorny/paths-filter calls the pulls.listFiles API on a pull_request event, which the
    # workflow-level `contents: read` does not cover — the first real run failed here with
    # "Resource not accessible by integration". Granted per-job rather than at the top, so only
    # this job can read pull requests and every other job keeps the narrower default.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      migrations: ${{ steps.filter.outputs.migrations }}
      conformance: ${{ steps.filter.outputs.conformance }}
      harness: ${{ steps.filter.outputs.harness }}
      fixtures: ${{ steps.filter.outputs.fixtures }}
      docker: ${{ steps.filter.outputs.docker }}
      # Derived once rather than repeated as a long `if:` on five jobs. True for a merge to main
      # and for a manual run — the contexts where skipping a check to save minutes is the wrong
      # trade. Deliberately NOT true on `schedule`: the nightly run exists for the supply-chain
      # audit alone, and rebuilding the workspace every night to learn nothing is exactly the
      # redundant work this pipeline is meant to avoid.
      full: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Skipped on `schedule`, which has no meaningful base commit to diff against — the action
      # would either error or compare against something arbitrary. Skipped, its outputs are empty,
      # so every change-gated job below evaluates false and only `audit` runs.
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - 'deny.toml'
            migrations:
              - 'crates/amk-store/migrations/**'
            conformance:
              - 'conformance/**'
              - 'reference/openapi.json'
            harness:
              - 'scripts/**'
              - '.claude/settings.json'
              - '.claude/contracts/**'
              - '.github/**'
            fixtures:
              - 'reference/fixtures/**'
            docker:
              - 'Dockerfile'
              - '.dockerignore'

  # ---------------------------------------------------------------- cheap, no compile
  # These need no cargo build, so they run in parallel with everything and return in under a
  # minute. Putting them behind `build` would be pure latency.

  fmt:
    name: fmt
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: lint
      - run: ./scripts/verify.sh fmt

  # The ledger reads files, never compiles. It also gates the harness and this pipeline's own
  # configuration, so it runs on EVERY event — a change that touches nothing but .github/ still
  # has to satisfy it.
  ledger:
    name: plan ledger
    needs: changes
    # Every event except the nightly audit. It reads files and gates the harness AND this
    # pipeline's own configuration, so a change touching nothing but .github/ still faces it.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: ./scripts/verify.sh ledger

  hooks:
    name: write-guard tests
    needs: changes
    if: needs.changes.outputs.harness == 'true' || needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: ./scripts/verify.sh hooks

  # ---------------------------------------------------------------- compile once
  # THE artifact producer. Compiles the workspace and every test target, saves the only cache any
  # job writes, and uploads the binaries that the gate and the container image consume. Nothing
  # downstream runs `cargo build` on the same code again.
  build:
    name: build
    needs: changes
    if: >-
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.fixtures == 'true' ||
      needs.changes.outputs.conformance == 'true' ||
      needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: workspace
          save-cache: "true"
      - run: ./scripts/verify.sh build
      # Only the two binaries, not target/ — the cache already carries intermediates, and an
      # artifact is for crossing the job boundary, not for storage.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: amk-binaries
          path: |
            target/debug/amk
            target/debug/amkd
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------- compile-dependent, parallel
  # All three restore build's cache, so each is a link step rather than a rebuild. They are
  # independent of one another and deliberately not chained.

  clippy:
    name: clippy
    needs: [changes, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: workspace
      - run: ./scripts/verify.sh clippy

  test:
    name: test
    needs: [changes, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Provisioned as a service container rather than by scripts/dev-db.sh. The script exists to
    # avoid a Docker dependency on machines that lack one; a GitHub runner has Docker and a warm
    # image, so this is faster. What is REUSED is the contract the tests actually bind to — the
    # port, role, password and database name — not the provisioning mechanism.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: amk
          POSTGRES_PASSWORD: amk-dev-local
          POSTGRES_DB: amk
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U amk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: workspace
      # verify.sh hard-fails without a reachable database, which is the whole point: a green test
      # job here can never mean "the DB-backed suite was skipped".
      - run: ./scripts/verify.sh test

  fixtures:
    name: fixture reconciliation
    needs: [changes, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: workspace
      - run: ./scripts/verify.sh fixtures

  provenance:
    name: shape provenance
    needs: [changes, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: workspace
      - run: ./scripts/verify.sh provenance

  # ---------------------------------------------------------------- supply chain
  # Runs on dependency changes AND nightly, because an advisory is published against code that has
  # not changed. Needs no compile, so it does not wait for build.
  audit:
    name: supply chain
    needs: changes
    if: >-
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.full == 'true' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: lint
      # A prebuilt binary; compiling cargo-deny from source would cost more than the check.
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2
        with:
          tool: cargo-deny
      - run: ./scripts/verify.sh audit

  # ---------------------------------------------------------------- the expensive gate
  # Lane L of the phase gate: schemathesis over every implemented path, plus both official SDKs
  # driving a real served amkd. Minutes, not seconds — so on a pull request it runs only when
  # something it could actually catch has changed, and on main it always runs.
  #
  # It consumes build's BINARY ARTIFACT and never compiles. It holds no credential: `--lane-l`
  # omits the dual-target diff, which is the only conjunct that calls api.agentmail.to.
  gate-lane-l:
    name: gate (Lane L)
    needs: [changes, build]
    if: >-
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.conformance == 'true' ||
      needs.changes.outputs.migrations == 'true' ||
      needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    # Sized for the FULL profile, which measured ~50 minutes locally. The previous 45 was smaller
    # than the work: the job ran 45.3 minutes, was killed mid-schemathesis, and produced nothing —
    # the most expensive way this pipeline could possibly fail. The reduced profile finishes in
    # about three minutes, so this ceiling only ever applies to a full run.
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: amk
          POSTGRES_PASSWORD: amk-dev-local
          POSTGRES_DB: amk
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U amk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: amk-binaries
          path: target/debug
      - run: chmod +x target/debug/amk target/debug/amkd

      # The gate shells out to psql for its throwaway database.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: py
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            conformance/requirements-gate.txt
            conformance/requirements-schemathesis.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: conformance/package-lock.json

      # The two virtualenvs p1-gate.sh expects. Keyed on the requirements files themselves, so a
      # pin change invalidates and nothing else does.
      # Keyed on the EXACT interpreter as well as the pins. A virtualenv is a tree of symlinks into
      # one specific Python install, so a cache restored across a patch bump (3.12.13 -> 3.12.14)
      # has dangling symlinks and presents as "bin/python3: no such file" — which is precisely how
      # the Lane L gate failed on its first CI run. p1-gate.sh's ensure_venv now repairs that, so
      # this key is defence in depth: it avoids restoring a venv that would only be thrown away.
      - name: Cache conformance virtualenvs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .venv-gate
            .venv-schemathesis
          key: venvs-${{ runner.os }}-${{ steps.py.outputs.python-version }}-${{ hashFiles('conformance/requirements-gate.txt', 'conformance/requirements-schemathesis.txt') }}

      - name: Install the official Node SDK
        working-directory: conformance
        run: npm ci

      # p1-gate.sh creates either virtualenv if it is absent, so a cache miss is slower, never
      # broken. Both are pinned, so a hit is exact.
      # WHICH GUARD RUNS, AND WHEN. Measured on this repository with 45 mounted operations:
      # coverage 1519s, fuzzing 1039s, stateful 249s — about 47 minutes of schemathesis, and the
      # single most expensive thing here. Paying it on every pull request is disproportionate;
      # never paying it is not a gate. So:
      #
      #   pull request          reduced — examples+fuzzing, 5 examples, ~3 minutes measured
      #   pull request labelled `full-gate`   full, on demand, before merging something risky
      #   push to main          full
      #   workflow_dispatch     full
      #
      # The reduced profile still stands up a real server, runs both official SDK smokes in full,
      # and fuzzes every mounted operation — it lowers depth, not coverage of the surface. The
      # gate prints which profile ran, so a reduced pass cannot be read as the full guard.
      - name: Choose the gate profile
        run: |
          FULL='${{ github.event_name != 'pull_request'
                 || contains(github.event.pull_request.labels.*.name, 'full-gate') }}'
          if [ "$FULL" = "true" ]; then
            echo "AMK_ST_PHASES=examples,coverage,fuzzing,stateful" >> "$GITHUB_ENV"
            echo "AMK_ST_EXAMPLES=40" >> "$GITHUB_ENV"
            echo "::notice::Lane L gate: FULL profile"
          else
            echo "AMK_ST_PHASES=examples,fuzzing" >> "$GITHUB_ENV"
            echo "AMK_ST_EXAMPLES=5" >> "$GITHUB_ENV"
            echo "::notice::Lane L gate: REDUCED profile (label a PR 'full-gate' for the full one)"
          fi

      - name: Run the Lane L gate
        run: ./scripts/verify.sh gate-lane-l

  # ---------------------------------------------------------------- validate the image
  # Builds the container WITHOUT pushing, so a broken Dockerfile is caught before merge rather
  # than as a red main. This exists because the environment these workflows were authored in has
  # Docker Hub blocked at its proxy, so the Dockerfile could not be built locally — and "I could
  # not verify it here" is not a reason to ship it unverified. A GitHub runner reaches Docker Hub
  # fine, so CI is where it gets proven.
  #
  # Scoped to changes in the Dockerfile itself, not to every Rust change: a release build costs
  # minutes, and what this job validates is the IMAGE DEFINITION. Source correctness is already
  # covered by build/clippy/test. No registry permissions at all — it cannot push, by construction
  # rather than by an `if:`.
  image-validate:
    name: validate image build
    needs: [changes, build]
    if: needs.changes.outputs.docker == 'true' || needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Base images come from Docker Hub by default and from this repository's own GHCR mirror
      # once USE_GHCR_BASE is set. The DIGESTS are identical either way — the mirror copies by
      # digest — so flipping this changes where bytes are fetched from, never which bytes.
      - name: Resolve base image source
        run: |
          set -euo pipefail
          RUST=$(sed -n 's/^ARG RUST_IMAGE=//p' Dockerfile)
          RUNTIME=$(sed -n 's/^ARG RUNTIME_IMAGE=//p' Dockerfile)
          if [ "${{ vars.USE_GHCR_BASE }}" = "true" ]; then
            NS="ghcr.io/${{ github.repository }}/base"
            RUST="$NS/rust@${RUST#*@}"
            RUNTIME="$NS/debian@${RUNTIME#*@}"
            echo "::notice::base images from the GHCR mirror"
          else
            echo "::notice::base images from Docker Hub (run 'Mirror base images', then set USE_GHCR_BASE=true)"
          fi
          echo "RUST_IMAGE=$RUST"       >> "$GITHUB_ENV"
          echo "RUNTIME_IMAGE=$RUNTIME" >> "$GITHUB_ENV"

      - name: Build (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: false
          build-args: |
            RUST_IMAGE=${{ env.RUST_IMAGE }}
            RUNTIME_IMAGE=${{ env.RUNTIME_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------- container image
  # Built ONCE, on main only, and identified by DIGEST from here on. Every later stage promotes
  # that exact digest; nothing rebuilds from source per environment, because an image rebuilt for
  # production is not the image that was tested in staging.
  image:
    name: build image
    needs: [changes, clippy, test, fixtures, provenance, ledger, audit, gate-lane-l]
    # OFF until someone turns it on, for two reasons that both point the same way.
    #
    # 1. Nothing consumes it yet. `deploy-*` are gated on DEPLOY_ENABLED and therefore skipped, so
    #    building and pushing a container on every merge to main would be work whose output has no
    #    reader — the precise redundancy this pipeline exists to remove.
    # 2. The build has never been validated. It could not be: the environment these workflows were
    #    authored in has Docker Hub blocked at the proxy (`docker pull alpine` returns 403 from the
    #    CDN), so the Dockerfile is reviewed but unexecuted. Letting an unexecuted build run
    #    automatically on main means discovering its first defect as a red main.
    #
    # `workflow_dispatch` is included so it can be validated ONCE, on demand, before being switched
    # on — rather than by merging and hoping. Set the repository variable PUBLISH_IMAGE=true when
    # that run is green. DEPLOY_ENABLED additionally gates the promotion stages below, and those
    # depend on this job, so deploying requires both.
    if: >-
      vars.PUBLISH_IMAGE == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      # For build provenance attestation — proves this digest came from this workflow and commit.
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=main
      # Base images come from Docker Hub by default and from this repository's own GHCR mirror
      # once USE_GHCR_BASE is set. The DIGESTS are identical either way — the mirror copies by
      # digest — so flipping this changes where bytes are fetched from, never which bytes.
      - name: Resolve base image source
        run: |
          set -euo pipefail
          RUST=$(sed -n 's/^ARG RUST_IMAGE=//p' Dockerfile)
          RUNTIME=$(sed -n 's/^ARG RUNTIME_IMAGE=//p' Dockerfile)
          if [ "${{ vars.USE_GHCR_BASE }}" = "true" ]; then
            NS="ghcr.io/${{ github.repository }}/base"
            RUST="$NS/rust@${RUST#*@}"
            RUNTIME="$NS/debian@${RUNTIME#*@}"
            echo "::notice::base images from the GHCR mirror"
          else
            echo "::notice::base images from Docker Hub (run 'Mirror base images', then set USE_GHCR_BASE=true)"
          fi
          echo "RUST_IMAGE=$RUST"       >> "$GITHUB_ENV"
          echo "RUNTIME_IMAGE=$RUNTIME" >> "$GITHUB_ENV"

      - name: Build and push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RUST_IMAGE=${{ env.RUST_IMAGE }}
            RUNTIME_IMAGE=${{ env.RUNTIME_IMAGE }}
          # GitHub's own cache backend, scoped to this repository. `max` keeps intermediate
          # stages so a dependency-only change reuses the compiled-dependency layer.
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # ---------------------------------------------------------------- promote the same digest
  # Staging first, unconditionally. Production is a separate call to the SAME reusable workflow
  # with a different environment, and GitHub's environment protection rules are what hold the
  # manual approval — not an `if:` a contributor could edit in a pull request.
  #
  # THE permissions BLOCK IS LOAD-BEARING, NOT DECORATION. A called workflow may not request more
  # than its CALLING job holds, and GitHub enforces that when it parses the run — so the whole
  # workflow concluded `startup_failure`, with no job, no log and no annotation, purely because
  # deploy.yml's job asks for `packages: read` while the caller granted `contents: read` alone.
  # Proven by two probes differing only in this block: without it startup_failure, with it the run
  # started and reached deploy.yml's own credential check. Keep these in step with deploy.yml.
  deploy-staging:
    name: deploy staging
    needs: image
    # Opt-in. Until the cluster credentials exist, deployment is OFF rather than silently
    # succeeding: set the repository variable DEPLOY_ENABLED=true when the environments are
    # provisioned. A no-op deploy that reports green is the same defect as a skipped test that
    # reports green, and this project has already been bitten by the second one.
    if: vars.DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      image: ${{ needs.image.outputs.image }}
      digest: ${{ needs.image.outputs.digest }}
    # Named explicitly rather than `secrets: inherit`. Inherit passes EVERY secret the caller holds
    # into a workflow that runs kubectl against a cluster; naming the one it needs is the same
    # least-privilege rule the permissions blocks follow.
    secrets:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

  deploy-production:
    name: deploy production
    needs: [image, deploy-staging]
    if: vars.DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      image: ${{ needs.image.outputs.image }}
      digest: ${{ needs.image.outputs.digest }}
    secrets:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

  # ---------------------------------------------------------------- the required check
  # Branch protection points at THIS job and nothing else.
  #
  # Why it has to exist: a required check that was SKIPPED reports success to branch protection.
  # So if `test` were required directly, a pull request that tricked change-detection into
  # skipping it would merge green having run nothing. This job always runs, and fails unless every
  # job it names either succeeded or was legitimately skipped by change detection — which it can
  # tell apart, because a skipped job's result is 'skipped' and a failed one's is 'failure'.
  gate:
    name: gate
    needs:
      - changes
      - fmt
      - ledger
      - hooks
      - build
      - clippy
      - test
      - fixtures
      - provenance
      - audit
      - gate-lane-l
      - image-validate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert no required job failed or was cancelled
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          # Any failure or cancellation fails the gate. 'skipped' is allowed ONLY because change
          # detection is the thing that skips, and it is reviewed in this repository like any other
          # code. 'success' and 'skipped' are the only acceptable terminal states.
          bad=$(echo "$RESULTS" | python3 -c "
          import json,sys
          n=json.load(sys.stdin)
          print(' '.join(k for k,v in n.items() if v['result'] not in ('success','skipped')))
          ")
          if [ -n "$bad" ]; then
            echo "::error::required jobs did not pass: $bad"
            exit 1
          fi
          echo "all required jobs passed or were skipped by change detection"
