# THE pipeline. One workflow, one required check (`ci-ok`), every CI/CD concern in one place:
# gate, supply-chain audit, MSRV, image publish, release, and the on-demand heavy checks.
#
# Reversing a recorded decision: `docs/PLAN.md` recorded 2026-08-15 that this project has no forge
# CI, on the premise of one operator on one machine. The 2026-08-17 GitHub migration -- made so
# cloud sandboxes could drive the repo -- ended that premise, and an audit on 2026-08-19 found the
# cost: 336 of 705 tests (48%) silently skipped without Postgres while `check.sh` printed PASS,
# `main` sitting red on a fixture tripwire nobody had run, and a binary that could not send mail
# with every local gate green. The `ci-layer-local-only` ledger check is retired accordingly.
#
# 2026-09-23: unified. The former ci/nightly/conformance/release split is folded into this one
# file, and NOTHING runs on a timer. Every run traces to an event a person caused: a PR, a push to
# main, a `v*` tag, or a manual dispatch. `plan-ledger.sh`'s `ci-single-unified-workflow` asserts
# both halves -- one workflow file, no `schedule:` -- so a second workflow or a cron is a failure.
#
# Design notes live next to the thing they explain; the short version:
#   cheap first      a ladder of stages; each costs more than the last and starts only once
#                    everything cheaper has passed (see the STAGES block under `jobs:`)
#   affected-only    scripts/affected-crates.sh, reverse-dependency closure, fails OPEN
#   build once       one release build, uploaded, consumed by every downstream job and the release
#   promote by tag   a `v*` tag re-tags main's image by digest; it never rebuilds it
#   one required     `ci-ok` aggregates, so branch protection never needs editing again
#   on demand        conformance (needs a credential), mutation testing and the cold-cache run are
#                    workflow_dispatch inputs -- too slow or too costly for every push, never cron
name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      conformance:
        description: "Lane R: dual-target diff vs api.agentmail.to (needs AGENTMAIL_READONLY_KEY)"
        type: boolean
        default: false
      mutants:
        description: "Mutation testing on amk-core + amk-types (up to 2h)"
        type: boolean
        default: false
      cold_cache:
        description: "Full test suite with every cache disabled (reproducibility)"
        type: boolean
        default: false

# Least privilege at the top; jobs elevate individually and only where they must.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; NEVER cancel on main, where a half-finished run can leave a
  # published image or a release tag behind. The asymmetry is deliberate.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # A build that fetches during compilation is a build whose inputs are not the lockfile.
  CARGO_NET_RETRY: "3"
  RUST_BACKTRACE: "1"

jobs:
  # ---------------------------------------------------------------------------------------------
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      # A tag push or a manual dispatch has no meaningful diff base, so the filter step is skipped
      # and every bucket defaults to true. Widening is the only safe answer, as below.
      rust: ${{ steps.filter.outputs.rust || 'true' }}
      conformance: ${{ steps.filter.outputs.conformance || 'true' }}
      docker: ${{ steps.filter.outputs.docker || 'true' }}
      crates: ${{ steps.affected.outputs.crates }}
      any_crate: ${{ steps.affected.outputs.any_crate }}
      source_date_epoch: ${{ steps.sde.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A PR needs its merge base to diff against; main needs the previous commit.
          fetch-depth: 0
          persist-credentials: false

      # The commit timestamp, for reproducible image builds: file mtimes inside the image derive
      # from this, so the same commit built twice produces the same digest instead of two that
      # differ only in when they were built.
      - id: sde
        run: echo "epoch=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"

      # Coarse buckets, for deciding which JOBS run at all.
      - id: filter
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - 'scripts/**'
              - '.github/**'
            conformance:
              - 'conformance/**'
              - 'reference/**'
            docker:
              - 'Dockerfile'
              - 'crates/**'
              - 'Cargo.lock'

      # Fine selection, for deciding WHICH CRATES those jobs touch. This is a separate step from
      # the filter above on purpose: path filtering answers "did Rust change", and only the
      # dependency graph can answer "what does that change reach". See affected-crates.sh.
      - id: affected
        # Through the environment, not spliced into the script: see ci-ok's note on injection.
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"
          elif [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
            base="$PUSH_BEFORE"
          else
            base=""   # tag push / manual dispatch: always the whole workspace
          fi
          # A first push to a branch, a force-push, or a shallow history leaves no usable base.
          # Widening is the only safe answer -- an empty diff would select nothing and pass.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "no usable merge base; testing the whole workspace"
            changed=""
          else
            changed=$(git diff --name-only "$base"...HEAD)
          fi
          if [ -z "$changed" ]; then
            sel="ALL"
          else
            printf '%s\n' "$changed" | sed 's/^/  /'
            sel=$(printf '%s\n' "$changed" | ./scripts/affected-crates.sh | tr '\n' ' ')
          fi
          sel=$(echo "$sel" | xargs || true)
          echo "selection: '${sel}'"
          if [ "$sel" = "ALL" ]; then
            echo "crates=--workspace" >> "$GITHUB_OUTPUT"
            echo "any_crate=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$sel" ]; then
            echo "crates=" >> "$GITHUB_OUTPUT"
            echo "any_crate=false" >> "$GITHUB_OUTPUT"
          else
            echo "crates=$sel" >> "$GITHUB_OUTPUT"
            echo "any_crate=true" >> "$GITHUB_OUTPUT"
          fi


  # ---------------------------------------------------------------------------------------------
  # STAGES. Expensive work is gated by cheap work: a stage starts only when every stage before it
  # has passed, so a formatting slip or a leaked secret costs seconds, not a Postgres-backed test
  # run, a release build and an SDK/schemathesis lane. Within a stage, jobs run in parallel.
  #
  #   0  changes                                   what changed (seconds)
  #   1  fmt guards secrets-scan dockerfile-lint   no compilation at all      -> gate-cheap
  #      supply-chain
  #   2  clippy msrv                               type-check only, no codegen -> gate-static
  #   3  test-unit                                 debug build + pure-logic tests
  #   4  test-db build-bins                        Postgres suite; the one release build
  #   5  binary-smoke                              the composed binary against Postgres
  #   6  lane-l                                    both SDKs + schemathesis
  #   7  docker (main) / release (v* tag)          publish, only after everything above
  #   on demand: conformance after lane-l; mutants and cold-cache after test-unit
  #
  # The gate-* jobs exist because a stage can be legitimately SKIPPED (a docs-only PR skips every
  # Rust job) and GitHub skips everything downstream of a skipped job. A gate always reports, and
  # fails only on a real failure or cancellation, so "skipped" never blocks and never passes off
  # a failure as a skip.
  #
  # EVERY job past stage 1 therefore states its own status test: `!cancelled()` plus a success check
  # on the stage directly before it. Without one, GitHub's implicit `success()` requires EVERY
  # ancestor, transitively, to have succeeded -- so one skipped job anywhere upstream (fmt on a
  # fixture-only PR; docker/mutants on every PR) silently skips everything below it, and ci-ok
  # reports green with nothing tested. Observed on #14: a job skipped behind a green ci-ok.
  # `ci-explicit-status-on-chained-jobs` in plan-ledger.sh holds this.

  # ----------------------------------------------------------------------- stage 1: no compilation
  fmt:
    name: fmt
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-rust
        with: { shared-key: fmt }
      # Always whole-workspace: formatting is not a per-crate property and the check is seconds.
      - run: cargo fmt --all -- --check


  guards:
    name: guards (always, whole repo)
    needs: changes
    # NO `if:`. shape-provenance asserts the dependency graph and plan-ledger asserts repo-wide
    # obligations; both need full visibility and neither is scoped by what changed. Making these
    # conditional is precisely the "weakening coverage" the audit called out.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-rust
        with: { shared-key: guards }
      - run: ./scripts/shape-provenance.sh
      - run: ./scripts/plan-ledger.sh
      - run: ./scripts/hooks/guard.test.sh
      - run: ./scripts/affected-crates.test.sh


  secrets-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks-action requires a paid GITLEAKS_LICENSE on organization repos
      # (`imabee0` is an org). The CLI binary does not.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: "8.28.0"
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -C /tmp -xzf /tmp/gitleaks.tgz gitleaks
          /tmp/gitleaks version
          /tmp/gitleaks detect --source . --verbose --redact --exit-code 1


  dockerfile-lint:
    name: dockerfile lint
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # On PRs the `docker` job below does not run (it publishes, and publishing from an unmerged
      # branch would put an unreviewed digest in the registry) -- so without this, a Dockerfile
      # change reached main having had nothing check it at all.
      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning


  supply-chain:
    name: cargo-deny (${{ matrix.checks }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, bans licenses sources]
    # A CVE disclosed overnight against a pinned transitive dependency must be VISIBLE on the next
    # run but must not fail an unrelated PR -- so advisories report without blocking, while bans,
    # licences and sources (which only change when this repo changes) block. deny.toml's allow-list
    # was DERIVED from `cargo metadata`, so a new licence here is a real supply-chain change.
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check ${{ matrix.checks }}


  gate-cheap:
    name: "gate 1: cheap checks"
    # Always reports (see STAGES). `!cancelled()`, not `always()`: a cancelled run stops here.
    if: ${{ !cancelled() }}
    needs: [changes, fmt, guards, secrets-scan, dockerfile-lint, supply-chain]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verdict
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::the cheap checks failed -- nothing more expensive will run"
          exit 1
      - run: echo "the cheap checks passed or were legitimately skipped"


  # ----------------------------------------------------------------- stage 2: type-check, no codegen
  clippy:
    name: clippy
    needs: [changes, gate-cheap]
    if: >-
      !cancelled() && needs.gate-cheap.result == 'success'
      && needs.changes.outputs.any_crate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-rust
        with: { shared-key: clippy }
      - run: cargo clippy ${{ needs.changes.outputs.crates }} --all-targets -- -D warnings


  msrv:
    name: MSRV (1.94)
    needs: [changes, gate-cheap]
    if: >-
      !cancelled() && needs.gate-cheap.result == 'success'
      && needs.changes.outputs.any_crate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # `rust-version = "1.94"` in Cargo.toml is a CLAIM. rust-toolchain.toml pins 1.94.1, so every
      # other job builds with that exact compiler and a 1.94.1-only assumption would land
      # unnoticed. This job is `cargo +1.94` (the floor) -- where the claim becomes a test.
      - run: rustup toolchain install 1.94 --profile minimal
      - uses: ./.github/actions/setup-rust
        with: { shared-key: msrv }
      - run: cargo +1.94 check --workspace --all-targets


  gate-static:
    name: "gate 2: static analysis"
    # Always reports (see STAGES). `!cancelled()`, not `always()`: a cancelled run stops here.
    if: ${{ !cancelled() }}
    needs: [gate-cheap, clippy, msrv]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verdict
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::clippy and MSRV failed -- nothing more expensive will run"
          exit 1
      - run: echo "clippy and MSRV passed or were legitimately skipped"


  # --------------------------------------------------------------- stage 3: build + pure-logic tests
  test-unit:
    name: tests (no database)
    needs: [changes, gate-static]
    if: >-
      !cancelled() && needs.gate-static.result == 'success'
      && needs.changes.outputs.any_crate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-rust
      # AMK_REQUIRE_DB is deliberately UNSET here: this job is the pure-logic half and must pass
      # with no database at all. The DB-backed half is `test-db`, which requires one.
      - run: cargo test ${{ needs.changes.outputs.crates }}


  # ------------------------------------------------------ stage 4: Postgres suite + the release build
  test-db:
    name: tests (Postgres required)
    needs: [changes, test-unit]
    if: >-
      !cancelled() && needs.test-unit.result == 'success'
      && needs.changes.outputs.any_crate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: amk
          POSTGRES_PASSWORD: amk-dev-local
          POSTGRES_DB: amk
        # The suite reaches the cluster on 55432 -- the same port dev-db.sh uses locally, so the
        # DSN in test support needs no CI-specific branch.
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U amk"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # THE POINT OF THIS JOB. Unset, 336 of 705 tests skip themselves and the run still reports
      # success; set, an unreachable database panics. This single line is the largest thing CI
      # buys over the local gate.
      AMK_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-rust
      - run: cargo test ${{ needs.changes.outputs.crates }} -- --nocapture
      - name: Assert the database half actually ran
        run: |
          set -euo pipefail
          # A green `cargo test` proves nothing about coverage if the DB tests opted out. Ask the
          # database whether the suite ever created anything in it.
          command -v psql >/dev/null || sudo apt-get install -qq -y postgresql-client
          n=$(psql "postgres://amk:amk-dev-local@127.0.0.1:55432/postgres" -tAc \
                "SELECT count(*) FROM pg_database WHERE datname LIKE 'amk%'")
          echo "amk-prefixed databases seen by the run: $n"
          [ "${n:-0}" -ge 1 ] || { echo "::error::AMK_REQUIRE_DB was set but no test database was ever created"; exit 1; }


  build-bins:
    name: build (once)
    needs: [changes, test-unit]
    if: >-
      !cancelled() && needs.test-unit.result == 'success'
      && needs.changes.outputs.any_crate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-rust
        with: { shared-key: release }
      # Release, because that is the artifact everything downstream consumes and eventually ships.
      # Compiled exactly once per run: binary-smoke, sdk-smoke and the image all download this.
      - run: cargo build --release -p amk-cli --bins
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bins-${{ github.sha }}
          path: |
            target/release/amk
            target/release/amkd
          retention-days: 7
          if-no-files-found: error


  # ------------------------------------------------------------- stage 5: the composed binary
  binary-smoke:
    name: binary smoke (composed binary)
    needs: [changes, build-bins, test-db]
    if: >-
      !cancelled() && needs.build-bins.result == 'success'
      && needs.test-db.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: amk
          POSTGRES_PASSWORD: amk-dev-local
          POSTGRES_DB: amk
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U amk"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bins-${{ github.sha }}
          path: target/release
      - run: chmod +x target/release/amk target/release/amkd
      - name: Install a psql client
        run: sudo apt-get install -qq -y postgresql-client
      - name: Run the smoke gate
        # AMK_SMOKE_SKIP_BUILD tells the script the binaries are already here -- rebuilding them
        # would defeat the build-once rule this job exists to honour.
        env:
          AMK_SMOKE_SKIP_BUILD: "1"
        run: |
          set -uo pipefail
          ./scripts/binary-smoke.sh
          rc=$?
          echo "binary-smoke exited $rc"
          # Exit 2 is "prerequisites unavailable". Locally that is an honest skip; HERE the
          # services block guarantees Postgres, so a 2 means the workflow is broken and must fail
          # rather than quietly verifying nothing -- the same rule the script itself enforces.
          [ "$rc" -eq 0 ] || exit 1


  # --------------------------------------------------------- stage 6: both SDKs + schemathesis
  lane-l:
    name: lane L (SDK smokes + schemathesis)
    needs: [changes, build-bins, binary-smoke]
    if: >-
      !cancelled() && needs.binary-smoke.result == 'success'
      && needs.build-bins.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: amk
          POSTGRES_PASSWORD: amk-dev-local
          POSTGRES_DB: amk
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U amk"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bins-${{ github.sha }}
          path: target/release
      - run: chmod +x target/release/amk target/release/amkd
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: conformance/requirements-*.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: conformance/package-lock.json
      - run: sudo apt-get install -qq -y postgresql-client
      - name: SDK smokes and schemathesis against the shipped binary
        env:
          AMK_GATE_SKIP_BUILD: "1"
          AMK_GATE_LANE: "L"
        run: |
          set -euo pipefail
          ./scripts/p1-gate.sh
          echo "p1-gate Lane L exited $?"

  # ------------------------------------------------------- stage 7: publish (main only)
  docker:
    name: image (build once, push by digest)
    needs: [changes, gate-cheap, gate-static, test-unit, test-db, build-bins, binary-smoke, lane-l]
    # Only on main, and on EVERY main push: a `v*` tag promotes the image of the commit it points at,
    # so every main commit must have one. A docs-only push rebuilds nothing -- every layer is a GHA
    # cache hit -- and yields the same digest. Publishing from an unmerged branch would put an
    # unreviewed digest in the registry, so PRs get `dockerfile-lint` instead.
    # Last rung: runs only after every stage has passed. `needs.gate-cheap.result == 'success'`
    # is explicit because gate-cheap always runs; the Rust stages may be legitimately SKIPPED on
    # a docs-only push, so for them the test is "nothing failed", not "everything succeeded".
    if: >-
      !cancelled() && needs.gate-cheap.result == 'success'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=main
      # Static lint before the build. It costs seconds and catches the class of thing that
      # otherwise surfaces only after a multi-minute compile -- and, unlike the build, it runs
      # anywhere, including environments whose egress policy blocks the registry.
      - name: hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # BuildKit layer cache. Paired with cargo-chef in the Dockerfile, this is what stops the
          # 308-dependency layer rebuilding on every source edit -- without chef the cache buys
          # almost nothing, because one changed line invalidates the whole cargo build layer.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
          build-args: |
            SOURCE_DATE_EPOCH=${{ needs.changes.outputs.source_date_epoch }}


  # ---------------------------------------------------------------------------------------------
  # ON DEMAND. Actions -> ci -> Run workflow, tick the box. Never on a timer, never on a PR.

  conformance:
    name: lane R (dual-target diff vs api.agentmail.to)
    # After lane L: our own SDK/schemathesis lane must pass before spending real requests on
    # someone else's production API.
    needs: [build-bins, lane-l]
    # workflow_dispatch only: a PR-triggered run -- a fork's above all -- must never reach this
    # secret, and the cheapest guarantee is that no PR event can start this job at all. The
    # manifest is 18 GETs and one `DELETE /v0/auth/me` probe; nothing is created on the reference
    # account, so a READ-ONLY key is sufficient and is what should be configured.
    if: >-
      !cancelled() && needs.lane-l.result == 'success' && needs.build-bins.result == 'success'
      && github.event_name == 'workflow_dispatch' && inputs.conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: conformance
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: amk, POSTGRES_PASSWORD: amk-dev-local, POSTGRES_DB: amk }
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U amk"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Require the reference key
        env:
          REF_KEY: ${{ secrets.AGENTMAIL_READONLY_KEY }}
        run: |
          # Absent secret -> fail loudly. "Not run" reported as "passed" is the failure mode the
          # 2026-08-19 audit was about.
          if [ -z "${REF_KEY:-}" ]; then
            echo "::error::AGENTMAIL_READONLY_KEY is not configured. This gate is NOT RUN, which is not the same as passed."
            exit 1
          fi
          echo "reference key present (value never printed)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # The gated binary from build-bins, not a second compile.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bins-${{ github.sha }}
          path: target/release
      - run: chmod +x target/release/amk target/release/amkd
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: conformance/requirements-*.txt
      - run: sudo apt-get install -qq -y postgresql-client
      - name: Stand up a candidate and diff it against the reference
        env:
          # /proc/<pid>/environ is owner-only; argv is world-readable. The key travels by
          # environment, never on a command line -- the same rule scripts/p1-gate.sh records.
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_READONLY_KEY }}
        run: |
          set -euo pipefail
          export AMK_DATABASE_URL="postgres://amk:amk-dev-local@127.0.0.1:55432/amk_conf"
          psql "postgres://amk:amk-dev-local@127.0.0.1:55432/postgres" -qc 'CREATE DATABASE amk_conf'
          export AMK_PRIMARY_DOMAIN=appsynergy.io AMK_PRODUCT_NAME=AgentMailKit AMK_BIND=127.0.0.1:8111
          ./target/release/amk migrate
          CAND_KEY=$(./target/release/amk init | sed -n 's/.*root api key: *//p' | tr -d ' ')
          ./target/release/amkd --role api &
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null -H "Authorization: Bearer $CAND_KEY" http://127.0.0.1:8111/v0/auth/me && break
            sleep 0.5
          done
          REF_KEY="$AGENTMAIL_API_KEY" CAND_BASE="http://127.0.0.1:8111" CAND_KEY="$CAND_KEY" \
            python3 conformance/dual_target.py conformance/manifest.json


  mutants:
    name: mutation testing
    # Mutating code whose own tests fail measures nothing: gated on test-unit.
    needs: test-unit
    if: >-
      !cancelled() && needs.test-unit.result == 'success'
      && github.event_name == 'workflow_dispatch' && inputs.mutants
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: mutants
          tools: cargo-mutants
      # Scoped to the two crates where a surviving mutant means silent data exposure rather than a
      # bug: amk-core is scope/permission/label logic, amk-types is every wire shape. Survivors
      # report without failing until a measured baseline exists to hold as a budget.
      - run: cargo mutants --package amk-core --package amk-types --no-shuffle -j 2 || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutants-${{ github.run_id }}
          path: mutants.out/
          if-no-files-found: warn


  cold-cache:
    name: cold cache (reproducibility)
    needs: test-unit
    if: >-
      !cancelled() && needs.test-unit.result == 'success'
      && github.event_name == 'workflow_dispatch' && inputs.cold_cache
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: amk, POSTGRES_PASSWORD: amk-dev-local, POSTGRES_DB: amk }
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U amk"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      AMK_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # cache: false is the entire point. A pipeline that only passes warm depends on cache state,
      # which is a bug that hides until the day the cache is evicted.
      - uses: ./.github/actions/setup-rust
        with: { cache: "false" }
      - run: sudo apt-get install -qq -y postgresql-client
      - run: cargo test --workspace
      - run: ./scripts/shape-provenance.sh && ./scripts/plan-ledger.sh

  # ---------------------------------------------------------------------------------------------

  ci-ok:
    name: ci-ok
    # THE ONE REQUIRED CHECK. Branch protection names this and nothing else, so adding a job above
    # never means editing a protection rule -- and a job that is accidentally never required
    # cannot hide, because it is a `needs:` here.
    if: always()
    needs:
      - changes
      - gate-cheap
      - gate-static
      - fmt
      - clippy
      - test-unit
      - test-db
      - guards
      - supply-chain
      - msrv
      - build-bins
      - binary-smoke
      - lane-l
      - secrets-scan
      - dockerfile-lint
      - docker
      - conformance
      - mutants
      - cold-cache
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verdict
        env:
          # Through the environment, not interpolated into the script body: expression output
          # spliced into shell source is an injection seam, and it is free to avoid.
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          # `skipped` is SUCCESS: a docs-only PR legitimately skips every Rust job, and failing on
          # that would make the required check unsatisfiable. `cancelled` is FAILURE -- a cancelled
          # run verified nothing, and treating it as a pass would let a superseded run merge a PR.
          bad=$(printf '%s' "$RESULTS" | jq -r '
            to_entries
            | map(select(.value.result == "failure" or .value.result == "cancelled") | .key)
            | join(" ")')
          if [ -n "$bad" ]; then
            echo "::error::failed or cancelled: $bad"
            exit 1
          fi
          echo "all required jobs succeeded or were legitimately skipped"


  # NO auto-merge job, deliberately. One existed until #14, and the first time it actually ran it
  # merged #14 as `github-actions` -- and GitHub never starts workflow runs from a push made with
  # GITHUB_TOKEN (its loop guard). So main's merge commit 0a669db got NO ci run: nothing tested it,
  # no image was published for it, and a `v*` tag on it would have been refused by `release`.
  # Auto-merge is instead enabled by the PR's author identity (repo setting "Allow auto-merge", then
  # `gh pr merge --auto --squash` or the Claude GitHub integration), whose merge is an ordinary push
  # that runs this workflow. `ci-no-github-token-merge` in plan-ledger.sh holds this.

  # ---------------------------------------------------------------------------------------------
  release:
    name: release ${{ github.ref_name }}
    # PROMOTE, never rebuild. The binaries are the ones build-bins produced and ci-ok gated IN THIS
    # RUN; the image is the one main's run already published for this commit, re-tagged by digest.
    # Recompiling here would ship a different artifact from the one the gate passed.
    needs: [ci-ok, build-bins]
    if: >-
      !cancelled() && needs.ci-ok.result == 'success' && needs.build-bins.result == 'success'
      && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Never cancel a release in flight: a half-published tag is worse than a slow one.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write   # create the GitHub release
      packages: write   # re-tag the existing image
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bins-${{ github.sha }}
          path: dist
      - name: Checksums
        run: |
          set -euo pipefail
          chmod +x dist/amk dist/amkd
          # Recorded in the release so a downloaded binary can be matched to its build.
          (cd dist && sha256sum amk amkd > SHA256SUMS)
          cat dist/SHA256SUMS
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Re-tag the existing image, do not rebuild it
        run: |
          set -euo pipefail
          img="ghcr.io/${GITHUB_REPOSITORY,,}"
          src="${img}:sha-${GITHUB_SHA}"
          # `docker` publishes sha-<commit> on every main push. A tag on a commit main never saw
          # has no gated image, and releasing one is exactly what this refuses to do.
          if ! docker buildx imagetools inspect "$src" >/dev/null 2>&1; then
            echo "::error::no image $src -- tag a commit that has passed ci on main"
            exit 1
          fi
          # `imagetools create` copies the manifest -- no pull, no rebuild, no layer push -- so the
          # release tag and the main tag are the SAME digest.
          docker buildx imagetools create --tag "${img}:${GITHUB_REF_NAME}" --tag "${img}:latest" "$src"
          docker buildx imagetools inspect "${img}:${GITHUB_REF_NAME}" --format '{{.Manifest.Digest}}'
      - uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          files: |
            dist/amk
            dist/amkd
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
