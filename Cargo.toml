[workspace]
resolver = "2"
members = ["crates/amk-types", "crates/amk-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://git.appsynergy.io/imabee/AgentMailKit"

# Pins verified in P-1 item 15 (reference/fixtures/15-compile-spike.txt): every
# version below resolves AND the APIs we rely on compile. Do not bump without
# re-running that spike.
[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
chrono = { version = "0.4.42", features = ["serde"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
thiserror = "2.0.17"
base64 = "0.22.1"
percent-encoding = "2.3.2"
