[workspace]
resolver = "2"
members = [
    "crates/amk-types",
    "crates/amk-core",
    "crates/amk-store",
    "crates/amk-http",
    "crates/amk-cli",
    "crates/amk-outbound",
    "crates/amk-ingest",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Appsynergy-io/AgentMailKit"
# Nothing here is published to crates.io: the seven crates are one deployable unit that happens to
# be split for the dependency-direction rule `scripts/shape-provenance.sh` enforces. Stating that
# is not cosmetic -- `cargo deny check bans` treats a version-less path dependency as a WILDCARD
# and fails on it for any crate it believes is publishable, because crates.io would reject the
# manifest. Declared here so the fact lives in one place, and so an accidental `cargo publish`
# refuses rather than uploading a private mail server.
publish = false

# Pins verified in P-1 item 15 (reference/fixtures/15-compile-spike.txt): every
# version below resolves AND the APIs we rely on compile. Do not bump without
# re-running that spike.
[profile.release]
# Symbols stripped by CARGO, not by a `strip` invocation in the Dockerfile.
#
# Two reasons, and the second is the one that matters. (1) `rust:*-slim` is not guaranteed to ship
# binutils, so calling `strip` there is a bet on the base image's package list. (2) The Dockerfile
# used to strip while `ci.yml`'s build-bins job did not -- so the binaries CI uploaded as its
# artifact and the binaries inside the image were DIFFERENT BYTES for the same commit, which
# quietly undermines the build-once story those two jobs exist to tell. Declaring it here makes
# every release build identical, wherever it runs.
strip = "symbols"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
chrono = { version = "0.4.42", features = ["serde"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
thiserror = "2.0.17"
base64 = "0.22.1"
percent-encoding = "2.3.2"

# amk-store onward. sqlx 0.9 compiled as assumed in the P-1 spike (fixture 15); the API-fit
# corrections that spike found apply to axum/mail-auth/hickory/rmcp, not to sqlx.
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate", "json",
] }
# Pinned exactly, like every other workspace dep. Cargo.lock made builds reproducible
# regardless, but the manifest is what a new contributor reads.
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }

# amk-http onward. Pinned exactly, like every other workspace dep, and verified against
# reference/fixtures/15-compile-spike.txt (F1: `features = ["ws"]` is required even though the
# WebSocket upgrade is P4 — `axum::extract::ws::WebSocketUpgrade` does not exist without it. F2:
# `uuid`'s `serde` feature, already enabled above, is required for `Path<Uuid>` extractors).
# amk-outbound. The three stalwart-labs crates in their SANCTIONED role — libraries consumed like
# any third party, confined to this one crate and converted at its edge. Versions verified in the
# P-1 compile spike (reference/fixtures/15-compile-spike.txt); do not bump without re-running it.
# `shape-provenance.sh` is what enforces that none of their types reaches a public signature.
# The exact versions the spike RESOLVED, not the loose ones its manifest requested. `mail-send`
# 0.6.0 depends on `mail-auth ^0.8`, which pins `hickory-resolver =0.26.0-alpha.1` and cannot
# co-resolve with `mail-auth 0.12`; 0.6.1 is the release that moved to the 0.12 line. The spike's
# `cargo tree` section is the authority here and its manifest section is not — the same "the
# capture beats the text" rule that has bitten this project six times.
mail-send = "=0.6.1"
mail-builder = "=0.4.4"
mail-auth = "=0.12.0"
mail-parser = "=0.11.6"
smtp-proto = "=0.2.3"

# Structured logging. `docs/PLAN.md`:190 requires "logs structured to stdout, key-ids never key
# material" and :206 names a metrics surface; neither existed -- an audit found ZERO `tracing::`
# or `log::` call sites workspace-wide and 26 `println!`s. Added now rather than after
# amk-events/jobs/dns/mcp exist, because threading it through six more crates later costs several
# times what threading it through four does.
#
# `tracing` is already in Cargo.lock at this exact version, pulled transitively by sqlx and
# hickory, so naming it directly adds no crate to the build. `tracing-subscriber` is genuinely
# new and is the only way anything is emitted; `json` is what makes the output structured rather
# than pretty, and `env-filter` is what lets an operator raise a level without a rebuild.
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = [
    "std", "fmt", "json", "env-filter", "ansi",
] }

axum = { version = "=0.8.9", features = ["ws"] }
tower = "=0.5.3"
