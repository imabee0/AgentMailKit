[package]
name = "amk-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Persistence: Postgres via sqlx, migrations, blob store, full-text search, signed downloads."

[dependencies]
amk-types = { path = "../amk-types" }
amk-core = { path = "../amk-core" }
# `macros` adds only the `sqlx::migrate!` compile-time embed used by src/pool.rs — this crate
# uses runtime `sqlx::query()` everywhere else (never `query!`/`query_as!`), specifically so the
# crate keeps building with no database present and no .sqlx offline cache to commit.
sqlx = { workspace = true, features = ["macros"] }
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
# api_keys.rs only. Not workspace-pinned (nothing else in the workspace needs them yet), but
# pinned exactly here for the same reason the workspace deps are: reproducibility. argon2 0.5.3
# is the latest non-prerelease release (0.6 is only available as a release candidate); its
# `password-hash` dependency pulls `rand_core` 0.6, so `rand` is pinned to the 0.8 line (which
# targets that same `rand_core`) rather than the newer 0.10 line, to avoid two incompatible
# `RngCore` traits at the `SaltString::generate` call site.
argon2 = "=0.5.3"
rand = "=0.8.5"

# Deliberately absent, and each for a reason the plan states:
#   serde       — this crate stores and retrieves; wire shapes live in amk-types. A Serialize
#                 derive here is a second wire shape outside the frozen-types boundary.
#   mail-parser / mail-auth / mail-send / mail-builder / smtp-proto — stalwart-labs crates belong
#                 to amk-ingest and amk-outbound, converted at that boundary. A shape-provenance
#                 check fails the build if one appears here.
#   amk-import  — the translation boundary must not invert; amk-import depends on this crate,
#                 never the reverse, so that it stays deletable after cutover.

[dev-dependencies]
tokio.workspace = true
serde_json.workspace = true
