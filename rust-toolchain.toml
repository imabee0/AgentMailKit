# The toolchain pin. Added 2026-08-19.
#
# `Cargo.toml`'s `rust-version = "1.94"` is the MSRV floor — sqlx 0.9.0 requires rustc 1.94.0 —
# and constrains which language features may be used. It does not pin the compiler, so two
# machines running `./scripts/check.sh` on identical source could reach different verdicts:
# rustfmt's output and clippy's lint set both move between releases, and `-D warnings` turns a
# new lint into a build failure that did not exist yesterday. That is the reproducibility gap
# this file closes.
#
# `channel = "1.94.1"` is the exact compiler for rustfmt and clippy.
#
# MSRV is verified separately, by the `msrv` job in `.github/workflows/ci.yml`, which builds
# against the rust-version floor (1.94) as well as this pin. Bumping the channel here is a deliberate act:
# re-run `./scripts/check.sh` in full and expect new clippy lints, exactly as bumping a
# dependency pin requires re-running the compile spike (`reference/fixtures/15-compile-spike.txt`).
[toolchain]
channel = "1.94.1"
components = ["rustfmt", "clippy"]
profile = "minimal"
